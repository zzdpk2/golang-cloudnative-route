apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mysqlclusters.database.example.com
spec:
  group: database.example.com
  scope: Namespaced
  names:
    plural: mysqlclusters
    singular: mysqlcluster
    kind: MySQLCluster
    shortNames:
      - mysql
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["replicas", "version", "storageGB"]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                version:
                  type: string
                storageGB:
                  type: integer
                  minimum: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                message:
                  type: string