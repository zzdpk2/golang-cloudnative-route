name: Test learning progress and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Evaluate required learning gates
        run: go run ./cmd/exercise

      - name: Evaluate optional learning gates
        continue-on-error: true
        run: go run ./cmd/exercise optional

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/learning-path/package-lock.json

      - name: Validate reset control plane
        run: |
          node --test .github/scripts/reset-control-plane.test.mjs
          node .github/scripts/reset-chapter.mjs 1 --dry-run
          node .github/scripts/reset-chapter.mjs 2 --dry-run
          node .github/scripts/reset-chapter.mjs 3 --dry-run
          node .github/scripts/reset-chapter.mjs 4 --dry-run

      - name: Install frontend dependencies
        working-directory: web/learning-path
        run: npm ci

      - name: Validate learning catalog
        working-directory: web/learning-path
        run: npm run validate

      - name: Check Svelte application
        working-directory: web/learning-path
        run: npm run check

      - name: Build GitHub Pages site
        working-directory: web/learning-path
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          VITE_RESET_API_URL: ${{ vars.RESET_API_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/learning-path/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
