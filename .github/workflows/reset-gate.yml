name: Reset learning gate

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Gate ID to restore to its red starter (for example F0 or R6)
        required: true
        type: string
      confirmation:
        description: Type RESET to confirm
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: reset-learning-gate
  cancel-in-progress: false

jobs:
  reset:
    if: github.actor == github.repository_owner && inputs.confirmation == 'RESET'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main with history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore gate starter
        env:
          RESET_GATE: ${{ inputs.gate }}
        run: |
          node --test .github/scripts/reset-control-plane.test.mjs
          node .github/scripts/reset-gate.mjs "$RESET_GATE" --dry-run
          node .github/scripts/reset-gate.mjs "$RESET_GATE"

      - name: Validate reset diff
        env:
          RESET_GATE: ${{ inputs.gate }}
        run: |
          node .github/scripts/reset-gate.mjs "$RESET_GATE" --stage
          git diff --cached --check
          git status --short

      - name: Commit reset
        env:
          RESET_GATE: ${{ inputs.gate }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Record reset of learning gate $RESET_GATE"
          else
            git commit -m "Reset learning gate $RESET_GATE"
          fi
          git push origin HEAD:main

      - name: Recalculate and deploy learning progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run learning-pages.yml --ref main
